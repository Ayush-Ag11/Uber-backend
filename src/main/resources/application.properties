spring.application.name=uber
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
osrm.api.base-url=https://router.project-osrm.org/route/v1/driving/
# Active profile — override this per environment
spring.profiles.active=local
rate.limit.auth.requests=5
rate.limit.auth.duration.minutes=1

management.endpoints.web.exposure.include=health,info

management.endpoints.web.exposure.exclude=env,beans,mappings,metrics,loggers,threaddump,heapdump

management.endpoint.health.show-details=when-authorized

management.endpoints.web.base-path=/manage

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true